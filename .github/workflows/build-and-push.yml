name: Build and push Docker images

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.train
            image_suffix: train
          - dockerfile: Dockerfile.predict
            image_suffix: predict

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image_suffix }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image_suffix }}:${{ github.sha }}
            ${{ github.ref_name == 'main' && format('{0}/{1}-{2}:latest', env.REGISTRY, github.repository, matrix.image_suffix) || '' }}
