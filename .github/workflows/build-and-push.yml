name: Build and push Docker images

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.train
            image_suffix: train
          - dockerfile: Dockerfile.predict
            image_suffix: predict

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=${{ env.REGISTRY }}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-${{ matrix.image_suffix }}
          BRANCH=${{ github.ref_name }}
          SHA=$(echo ${{ github.sha }} | cut -c1-7)

          docker build -f ${{ matrix.dockerfile }} -t $IMAGE:$BRANCH -t $IMAGE:$SHA .

          if [ "$BRANCH" = "main" ]; then
            docker tag $IMAGE:$BRANCH $IMAGE:latest
            docker push $IMAGE:latest
          fi

          docker push $IMAGE:$BRANCH
          docker push $IMAGE:$SHA
